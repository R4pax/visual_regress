reference: "https://sberdevices.ift.app.sberdevices.ru/?pr_auth_proxy_token=ce26d7350a6d2787bdc7e0b0defd1326"
current: "https://pr-1543-sberdevices.dev.app.sberdevices.ru/?pr_auth_proxy_token=d85addd0ecdd393fa2b42ad66e3b3b58"

urls:
  - "/"
  - "/gigachat/"
  - "/os/"
  - "/sberboom/"
  - "/sberboom-home/"
  - "/sberboom-micro/"
  - "/sberboom-mini/"
  - "/sberboom-mini-prostokvashino/"
  - "/sberboom-mini2/"
  - "/sberbox2/"
  - "/sberkot/"
  - "/smarthome/atlasdesignsmart/"
  - "/smarthome/climate/"
  - "/smarthome/"
  - "/smarthome/lighting/"
  - "/smarthome/security/"
  - "/smarthome/zigbee/"
  - "/sberboom-home-love/"

viewports:
  desktop: { width: 1440, height: 900 }
  mobile: { width: 360, height: 800 }

# Порог различий (0..1). 0.001 = 0.1% пикселей
diff_threshold: 0.002

# Задержка перед скриншотом (анимации, шрифты, отложенные блоки)
settle_ms: 1500

# Отключать анимации перед снимком
disable_animations: true

# Селекторы, которые вырезаем из DOM перед снимком (динамика)
mask_selectors:
  - "[data-lottie]"
  - ".lottie-container"
  - "svg[aria-label='animated']"

# Мок-эндпоинты: сопоставление с файлами в mocks/
mocks:
  "**/api/bx/v1/ecom/basket/page.php": "mocks/basket.json"
  "**/api/bx/v1/ecom/lk/page.php": "mocks/lk.json"
